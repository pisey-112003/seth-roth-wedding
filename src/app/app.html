<div class="relative w-full min-h-screen flex justify-center bg-[#f8f1eb] overflow-hidden">

  <!-- Main Content Wrapper -->
  <div class="relative w-full max-w-md md:max-w-3xl lg:max-w-md min-h-screen">

    <!-- Page Content -->
    <router-outlet></router-outlet>

    <!-- Floating Sound Button -->
    <div class="absolute top-3 right-3 z-50">
      <div
        class="bg-white backdrop-blur-sm rounded-full p-2 cursor-pointer hover:scale-110 transition"
        (click)="toggleAudio()"
      >
        <img
          [src]="isPlaying ? 'assets/icon/sound.png' : 'assets/icon/mute.png'"
          [alt]="isPlaying ? 'Sound On' : 'Muted'"
          class="w-4 h-4"
        />
      </div>
    </div>

  </div>

</div>
